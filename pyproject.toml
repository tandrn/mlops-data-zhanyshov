[tool.poetry]
name = "mlops-data-zhanyshov"
version = "0.1.0"
description = "Dataset versioning with Git, DVC and ClearML"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
dvc = "3.64.0"
clearml = "2.0.2"
scikit-learn = "1.7.2"
pandas = "2.3.3"
numpy = "2.3.4"
pathspec = "0.12.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
